name: Offline source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check source inventory, AST and synthetic contracts
        run: python -B scripts/check.py
      - name: Review publication inventory and known secret signatures
        run: python -B scripts/review_publication.py
      - name: Test publication guard with synthetic inputs
        run: python -B -m unittest discover -s scripts -p 'test_*.py'
